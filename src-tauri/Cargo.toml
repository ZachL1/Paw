[package]
name = "copyx"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "global-shortcut-all", "window-hide", "window-close", "window-show", "window-set-skip-taskbar", "window-minimize", "window-set-focus", "window-set-always-on-top", "shell-open", "system-tray", "global-shortcut"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
arboard = { version = "3", features = ["image-data"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
