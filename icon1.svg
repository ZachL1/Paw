<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#dark)"/>
  <!-- Left blade -->
  <ellipse cx="210" cy="210" rx="55" ry="18" fill="none" stroke="url(#sun)" stroke-width="5" transform="rotate(-35, 210, 210)"/>
  <!-- Right blade -->
  <ellipse cx="302" cy="210" rx="55" ry="18" fill="none" stroke="url(#sun)" stroke-width="5" transform="rotate(35, 302, 210)"/>
  <!-- Pivot -->
  <circle cx="256" cy="238" r="12" fill="url(#sun)"/>
  <!-- Handle rings -->
  <circle cx="192" cy="308" r="32" fill="none" stroke="url(#sun)" stroke-width="5"/>
  <circle cx="320" cy="308" r="32" fill="none" stroke="url(#sun)" stroke-width="5"/>
  <!-- Dashed cut line -->
  <line x1="120" y1="178" x2="392" y2="178" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" opacity="0.35"/>
</svg>
